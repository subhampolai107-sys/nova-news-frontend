<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
  content="width=device-width, initial-scale=1.0">

  <title>Login - NOVA NEWS</title>

  <link rel="stylesheet"
  href="style.css">

</head>

<body>

  <!-- LOGIN SECTION -->

  <section class="auth-page">

    <div class="auth-box">

      <h1>Login</h1>

      <!-- FORM -->

      <form id="loginForm">

        <!-- EMAIL -->

        <input
        type="email"
        id="loginEmail"
        placeholder="Enter Email"
        required>

        <!-- PASSWORD -->

        <input
        type="password"
        id="loginPassword"
        placeholder="Enter Password"
        required>

        <!-- BUTTON -->

        <button type="submit">

          Login

        </button>

      </form>

      <p>

        Don't have account?

        <a href="signup.html">
          Sign Up
        </a>

      </p>

    </div>

  </section>

  <script src="auth.js"></script>

</body>

</html>
