<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
  content="width=device-width, initial-scale=1.0">

  <title>Sign Up - NOVA NEWS</title>

  <link rel="stylesheet"
  href="style.css">

</head>

<body>

  <!-- SIGNUP SECTION -->

  <section class="auth-page">

    <div class="auth-box">

      <h1>Create Account</h1>

      <!-- FORM -->

      <form id="signupForm">

        <!-- NAME -->

        <input
        type="text"
        id="signupName"
        placeholder="Full Name"
        required>

        <!-- EMAIL -->

        <input
        type="email"
        id="signupEmail"
        placeholder="Email Address"
        required>

        <!-- PASSWORD -->

        <input
        type="password"
        id="signupPassword"
        placeholder="Create Password"
        required>

        <!-- BUTTON -->

        <button type="submit">

          Sign Up

        </button>

      </form>

      <p>

        Already have account?

        <a href="login.html">
          Login
        </a>

      </p>

    </div>

  </section>

  <script src="auth.js"></script>

</body>

</html>
