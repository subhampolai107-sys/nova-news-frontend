<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Author Profile - NOVA NEWS</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <nav>
    <div class="logo">
      <img src="images/logo.jpeg" alt="NOVA NEWS Logo">
      <h2>NOVA <span>NEWS</span></h2>
    </div>
  </nav>

  <section class="page-banner">
    <h1 id="authorName">Author</h1>
    <p id="authorArticleCount"></p>
  </section>

  <h2 class="section-title">Articles by <span id="authorNameInline"></span></h2>

  <section class="stories" id="authorArticlesContainer">
    <!-- Author ke articles yahan load honge -->
  </section>

  <footer>
    <div class="footer-bottom">
      © 2026 NOVA NEWS. All Rights Reserved.
    </div>
  </footer>

  <script src="author.js"></script>
</body>
</html>
